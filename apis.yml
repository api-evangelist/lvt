aid: lvt
name: LVT
description: 'LVT (LiveView Technologies) is an American physical-security company that builds solar-powered,
  cellular-connected mobile surveillance units (MSUs) and the SaaS/PaaS platform that runs them — live
  video, AI analytics, alerting, lights, loudspeakers and AI talk-down — for retail, commercial,
  industrial, critical-infrastructure and public-sector sites. Founded in 2005 and headquartered in
  American Fork, Utah, LVT publishes a public Partner API: a REST service over JSON, described by a
  first-party OpenAPI 3.0.3 document on GitHub, that lets SOC operators and integrators list live units
  and locations, control cameras (pan/tilt/zoom), start RTSP and WebRTC streams through the LVT camera
  relay, play sounds, toggle lights, initiate speaker talk-down, review and resolve security alert
  events, fetch signed media URLs, and register HMAC-signed webhooks. The same API backs LVT''s
  pre-built integrations with Immix, Axon Fusus and Genetec Security Center, and LVT units also present
  themselves to third-party VMS platforms as ONVIF cameras.'
