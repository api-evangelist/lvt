apis:
- aid: lvt-partner-api
  name: LVT Partner API
  description: 'LVT''s Partner API is a REST service using JSON payloads, described by a first-party
    OpenAPI 3.0.3 document published in the LiveViewTech/lvt-public-api GitHub repository. Version 1.0.1
    covers 33 operations across Live Units, Cameras, Streams, Locations, Alert Events, Media, Webhooks,
    Public Keys and Talkdown. Authentication is OAuth 2.0 client credentials against LVT''s Okta-backed
    authorization server; access is granted through a partnership agreement (email integrations@lvt.com).'
