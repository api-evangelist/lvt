  errors: errors/lvt-problem-types.yml
  lifecycle: lifecycle/lvt-lifecycle.yml
  authentication: authentication/lvt-authentication.yml
  scopes: scopes/lvt-scopes.yml
  rate_limits: rate-limits/lvt-rate-limits.yml
  webhooks: asyncapi/lvt-webhooks.yml
  data_model: data-model/lvt-data-model.yml
