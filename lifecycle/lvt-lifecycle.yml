runtime_lifecycle:
  note: >-
    The one genuinely lifecycle-shaped runtime object in this API is the stream. StartStream
    (POST /cameras/{cameraId}/streams) creates a stream that AUTO-EXPIRES; CheckIn
    (POST /streams/{streamId}:checkIn) extends it on the server-provided refreshInterval; CheckOut
    (DELETE /streams/{streamId}) ends it. After expiry or checkout, further checkIn/DELETE on that
    streamId return 404. Webhook endpoints have their own decay path: an endpoint that fails to return
    2xx is retried with exponential backoff (attempt ^ 2 seconds) and is AUTOMATICALLY DISABLED after
    10 failed attempts, with no notification sent; it must be re-enabled with PATCH /webhooks/{webhookId}.
