note: 'Entity-relationship graph derived mechanically from the LVT Partner API OpenAPI 3.0.3 document.
  LVT publishes no object reference page and no id-prefix scheme — every identifier in the contract is
  a bare RFC 4122 UUID (format: uuid), so an id carries no type information and an agent cannot tell a
  cameraId from a liveUnitId by inspection. The domain core is: a client owns locations, a location hosts
  liveUnits, a liveUnit hosts cameras plus lights and sounds, cameras produce streams, and liveUnits raise
  alerts which group into alertEvents carrying media, notes, an assigned user and a resolution.'
